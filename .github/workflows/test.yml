name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node public/core/sim.test.js
      - run: npm run test:game
      - run: npm run stress -- --games 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-game-report
          path: reports/
